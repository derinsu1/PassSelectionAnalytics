[project]
name = "pass-selection-analytics"
version = "1.0.0"
description = "A public, read-only A-League pass-selection analytics demo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "matplotlib>=3.9",
    "mplsoccer>=1.4.0",
    "numpy>=1.26,<2",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "pyarrow>=16.0,<17",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/pass_selection"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
